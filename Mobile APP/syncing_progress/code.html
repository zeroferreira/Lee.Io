<!DOCTYPE html>

<script id="tailwind-config">

            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#0dccf2",
                        "background-light": "#f5f8f8",
                        "background-dark": "#101f22",
                    },
                    fontFamily: {

<style>

            50% { opacity: 0; }

            animation: blink 1s step-end infinite;

        body {
            font-family: 'Inter', sans-serif;
        }

</div>
</div>

<div class="flex-grow flex flex-col items-center justify-center px-8 relative">

</div>
</div>

<div class="relative z-10 flex flex-col items-center">
<div class="flex items-center justify-center">
<h1 class="text-white tracking-tighter text-[48px] font-bold leading-tight text-center">
                    Leé-Io
                </h1>
<!-- Blinking Typewriter Cursor -->
<div class="w-[4px] h-[40px] bg-primary ml-2 typewriter-cursor rounded-full"></div>
</div>
<!-- Status Text (BodyText component style) -->
<div class="mt-8 flex flex-col items-center">
<p class="text-white/90 text-lg font-medium leading-normal text-center tracking-wide">
                    Sincronizando tu biblioteca...
                </p>
<p class="text-white/50 text-sm font-normal leading-normal mt-1 text-center">
                    Esto solo tomará un momento
                </p>
</div>
</div>
<!-- Progress Section (ProgressBar component) -->
<div class="w-full max-w-xs mt-12 z-10">
<div class="flex flex-col gap-3">
<div class="flex gap-6 justify-between items-end">
<p class="text-white/70 text-xs font-medium uppercase tracking-widest">Estado</p>
<p class="text-primary text-sm font-bold leading-normal">68%</p>
</div>
<div class="rounded-full bg-white/10 overflow-hidden h-1.5 w-full">

<div class="h-full rounded-full bg-primary" style="width: 68%;"></div>
</div>
</div>
</div>
</div>
